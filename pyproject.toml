[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enem-predictor-pipeline"
version = "0.1.0"
description = "Pipeline de Engenharia de Dados para Aquisição, Processamento e Classificação Temática do ENEM Predictor"
authors = [{name = "Data Engineering Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
enem-pipeline = "enem_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
